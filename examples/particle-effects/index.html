<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DDJS - Particle Effects Example</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        #game-container {
            text-align: center;
            background: #16213e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        
        h1 {
            margin-top: 0;
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
        }
        
        canvas {
            border: 2px solid #00ffff;
            border-radius: 5px;
            display: block;
            margin: 20px auto;
            background: #0f0f1e;
        }
        
        .info {
            text-align: left;
            color: #00ffff;
            margin-top: 10px;
            padding: 10px;
            background: #0f0f1e;
            border-radius: 5px;
            border: 1px solid #00ffff;
        }
        
        .controls {
            margin-top: 10px;
        }
        
        button {
            padding: 10px 20px;
            margin: 5px;
            background: #00ffff;
            color: #1a1a2e;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        button:hover {
            background: #00cccc;
            box-shadow: 0 0 10px #00ffff;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <h1>✨ DDJS Particle Effects Example</h1>
        <canvas id="gameCanvas"></canvas>
        <div class="info">
            <strong>Controls:</strong><br>
            • Click anywhere to create explosions<br>
            • Press SPACE for random effects<br>
            • Watch the particle magic!
        </div>
        <div class="controls">
            <button id="explosion">Big Explosion</button>
            <button id="trail">Trail Effect</button>
            <button id="fireworks">Fireworks</button>
            <button id="clear">Clear Particles</button>
        </div>
    </div>
    
    <script type="module" src="./main.js"></script>
</body>
</html>
