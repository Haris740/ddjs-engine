<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DDJS - Platformer Example</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        #game-container {
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        
        h1 {
            margin-top: 0;
            color: #2c3e50;
        }
        
        canvas {
            border: 3px solid #2c3e50;
            border-radius: 5px;
            display: block;
            margin: 20px auto;
            background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 100%);
        }
        
        .info {
            text-align: left;
            color: #666;
            margin-top: 10px;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 5px;
        }
        
        .score {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <h1>🎮 DDJS Platformer Example</h1>
        <canvas id="gameCanvas"></canvas>
        <div class="score">
            Score: <span id="score">0</span> | <span id="lives">Lives: 3</span>
        </div>
        <div class="info">
            <strong>Controls:</strong><br>
            • Arrow Keys or A/D to move<br>
            • SPACE or W to jump<br>
            • Collect the coins!
        </div>
    </div>
    
    <script type="module" src="./main.js"></script>
</body>
</html>
